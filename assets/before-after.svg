<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#010409"/>
  <text x="600" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#e6edf3">"I sent my friend a long message. She replied “k”. Is she mad?"</text>
  <text x="600" y="76" text-anchor="middle" font-size="17" font-style="italic" fill="#c9d1d9">An autistic adult who has reread one text 20 times since lunch.</text>
  <text x="600" y="99" text-anchor="middle" font-size="13" fill="#6e7681">Same model. Same question. The only difference is one skill file.</text>

  <rect x="40" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="64" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">BEFORE</text>
  <text x="560" y="148" text-anchor="end" font-size="13" fill="#f85149">74 words · no reasons given</text>
  <rect x="64" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="84" y="196" font-size="15">Oh no, I'm sure she's not mad! Honestly, people text in</text>
    <text x="84" y="218" font-size="15">all kinds of ways, so I really wouldn't read too much</text>
    <text x="84" y="240" font-size="15">into it. She was probably just busy. Some people just</text>
    <text x="84" y="262" font-size="15">aren't big texters! It's totally normal to feel anxious</text>
    <text x="84" y="284" font-size="15">about this, but try not to overthink it. If you're</text>
    <text x="84" y="306" font-size="15">really worried, you could always just ask her, but I'd</text>
    <text x="84" y="328" font-size="15">give it some time first. I'm sure everything is fine</text>
    <text x="84" y="350" font-size="15">between you two!</text>
  </g>
  <text x="84" y="524" font-size="12" fill="#f85149">✗ "I'm sure"  ✗ "just"  ✗ "overthink"  ✗ no reasons  ✗ one script</text>

  <rect x="615" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="639" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">AFTER · what-did-they-mean</text>
  <text x="1135" y="148" text-anchor="end" font-size="13" fill="#3fb950">84 words · reasons, 75% sure, 3 options</text>
  <rect x="639" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="659" y="196" font-size="15" font-weight="700">Most likely meaning: she is busy, not mad. 75% sure.</text>
    <text x="659" y="230" font-size="15">Literal reading: "k" means "okay, I read it."</text>
    <text x="659" y="252" font-size="15">Why probably not mad: one letter after a long message</text>
    <text x="659" y="274" font-size="15">usually means "saw this, can't reply properly now."</text>
    <text x="659" y="308" font-size="15">What they expect: nothing from you right now.</text>
    <text x="659" y="342" font-size="15">Your options:</text>
    <text x="659" y="364" font-size="15">1. Wait. Signals: relaxed, no pressure.</text>
    <text x="659" y="386" font-size="15">2. "No rush to reply!" Signals: you saw it, no worry.</text>
    <text x="659" y="408" font-size="15">3. "Are we okay?" Signals: you're worried. Fine to ask.</text>
    <text x="659" y="442" font-size="15" fill="#8b949e">What I'm not sure about: does she always text like this?</text>
    
  </g>
  <text x="659" y="524" font-size="12" fill="#3fb950">✓ meaning first  ✓ literal reading  ✓ confidence  ✓ 3 options</text>
</svg>
